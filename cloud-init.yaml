#cloud-config

package_update: true
package_upgrade: true

packages:
  - autojump
  - curl
  - git
  - just
  - python-is-python3
  - unzip
  - wget

write_files:
  - content: |
      alias ga='git add'
      alias gs='git status'
      alias gc='git commit'
      alias gcm='git checkout $(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)'
      alias gcmp='git checkout $(gh repo view --json defaultBranchRef -q .defaultBranchRef.name) && git pull'
      alias gd='git diff'
      alias gr='git fetch --all && git rebase'
      alias gp='git pull'
      alias gP='git push'
      alias js="juju status"
      alias jsw="juju status --watch 2s"
      alias k="kubectl"
      . /usr/share/autojump/autojump.sh

    append: true
    path: /home/ubuntu/.bashrc
    owner: 'ubuntu:ubuntu'
    defer: true

